name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint y APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint de Android
        run: ./gradlew :app:lintDebug --console=plain

      - name: APK de depuración
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Informes de tests y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
